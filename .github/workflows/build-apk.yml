name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false

      - name: Firmar release con debug key
        run: |
          python3 - <<'EOF'
          path = 'android/app/build.gradle'
          c = open(path).read()
          # Inserta signingConfig DENTRO del bloque release { existente
          c = c.replace('release {', 'release {\n            signingConfig signingConfigs.debug', 1)
          open(path, 'w').write(c)
          EOF

      - name: Build APK release
        working-directory: android
        run: ./gradlew assembleRelease -PbundleInRelease=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-rodante-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
